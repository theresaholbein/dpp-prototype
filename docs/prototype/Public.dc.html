<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Öffentliche Passseite – Basic T-Shirt</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/codegaia/tokens.css">
<link rel="stylesheet" href="ds/codegaia/components/bundle.css">
<script src="ds/codegaia/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"DM Sans";src:url("ds/codegaia/fonts/DMSans-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"DM Sans";src:url("ds/codegaia/fonts/DMSans-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"DM Sans";src:url("ds/codegaia/fonts/DMSans-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
body{margin:0}
a{color:#1459C7}a:hover{color:#104EB0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow-y: auto; background: var(--product-pages-background, #F8F9FC); font-family: 'DM Sans', var(--ui-font, sans-serif); color: #3F3F46; display: flex; flex-direction: column;">

  <div style="background: #ffffff; border-bottom: 1px solid rgba(20,89,199,.1); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px;">
    <a href="Main.dc.html" style="font-size: 0.8125rem; font-weight: 500; text-decoration: none; padding: 10px 0;">← Zur App</a>
    <span style="font-size: 0.75rem; color: #71717A; font-weight: 500;">{{t.passLabel}}</span>
    <div role="group" aria-label="Sprache" style="display: flex; border: 1px solid #D4D4D8; border-radius: 6px; overflow: hidden;">
      <sc-for list="{{langs}}" as="l" hint-placeholder-count="2">
        <button type="button" onClick="{{l.go}}" style="font-family: inherit; border: none; cursor: pointer; font-size: 0.8125rem; font-weight: 500; padding: 8px 12px; min-height: 36px; background: {{l.bg}}; color: {{l.fg}};">{{l.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="padding: 20px 16px 8px 16px; display: flex; flex-direction: column; gap: 6px;">
    <span style="font-size: 0.8125rem; color: #71717A;">Muster Textil GmbH</span>
    <h1 style="margin: 0; font-size: 1.5rem; font-weight: 500; color: #000317; line-height: 1.25;">{{t.name}}</h1>
    <span style="font-size: 0.875rem; color: #3F3F46;">{{t.sub}}</span>
  </div>

  <div style="padding: 8px 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
    <sc-for list="{{facts}}" as="k" hint-placeholder-count="4">
      <div style="background: #ffffff; border: 1px solid rgba(20,89,199,.1); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 0.75rem; color: #71717A;">{{k.label}}</span>
        <span style="font-size: 0.9375rem; font-weight: 500; color: #000317;">{{k.value}}</span>
      </div>
    </sc-for>
  </div>

  <div style="padding: 8px 16px; display: flex; flex-direction: column; gap: 8px;">
    <sc-for list="{{sections}}" as="sec" hint-placeholder-count="5">
      <div style="background: #ffffff; border: 1px solid rgba(20,89,199,.1); border-radius: 12px; overflow: hidden;">
        <button type="button" onClick="{{sec.toggle}}" aria-expanded="{{sec.open}}" style="font-family: inherit; width: 100%; border: none; background: transparent; cursor: pointer; padding: 14px 16px; min-height: 48px; display: flex; align-items: center; justify-content: space-between; font-size: 1rem; font-weight: 500; color: #000317; text-align: left;">
          <span>{{sec.title}}</span>
          <span aria-hidden="true" style="color: #1459C7; font-size: 1.125rem;">{{sec.sign}}</span>
        </button>
        <sc-if value="{{sec.open}}" hint-placeholder-val="{{false}}">
          <div style="padding: 0 16px 14px 16px; display: flex; flex-direction: column; gap: 10px;">
            <sc-for list="{{sec.rows}}" as="r" hint-placeholder-count="2">
              <div style="display: flex; flex-direction: column; gap: 2px; border-top: 1px solid #F1F1F4; padding-top: 10px;">
                <span style="font-size: 0.75rem; color: #71717A;">{{r.label}}</span>
                <span style="font-size: 0.9375rem; color: #000317; word-break: break-word;">{{r.value}}</span>
              </div>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="padding: 8px 16px; display: flex; flex-direction: column; gap: 8px;">
    <span style="font-size: 0.875rem; font-weight: 500; color: #3F3F46;">{{t.downloads}}</span>
    <sc-for list="{{docs}}" as="d" hint-placeholder-count="2">
      <a href="#" style="display: flex; align-items: center; gap: 10px; background: #ffffff; border: 1px solid rgba(20,89,199,.1); border-radius: 8px; padding: 12px; min-height: 44px; box-sizing: border-box; text-decoration: none; font-size: 0.875rem; font-weight: 500;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M7 10l5 5 5-5"></path><path d="M12 15V3"></path></svg>
        {{d}}
      </a>
    </sc-for>
  </div>

  <div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 10px;">
    <button type="button" onClick="{{toggleLogin}}" style="font-family: inherit; cursor: pointer; width: 100%; min-height: 44px; border-radius: 6px; border: 1px solid #1459C7; background: #ffffff; color: #1459C7; font-size: 0.9375rem; font-weight: 500;">{{t.pro}}</button>
    <sc-if value="{{showLogin}}" hint-placeholder-val="{{false}}">
      <div style="background: #E7F1FF; border-radius: 8px; padding: 12px; font-size: 0.875rem; color: #173976;">{{t.proText}}</div>
    </sc-if>
  </div>

  <footer style="margin-top: auto; padding: 16px; border-top: 1px solid rgba(20,89,199,.1); background: #ffffff; display: flex; flex-direction: column; gap: 3px; font-size: 0.75rem; color: #71717A;">
    <span>DPP-ID: dpp-7f3c2a91-demo</span>
    <span>{{t.version}}: v4 · {{t.updated}}: 24.11.2026</span>
    <span>{{t.operator}}: Muster Textil GmbH · {{t.hosted}}</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var TXT = {
  de: { passLabel: 'Digitaler Produktpass', name: 'Basic T-Shirt Bio-Baumwolle', sub: 'Artikel TS-1042 · Charge L2026-114', downloads: 'Dokumente', pro: 'Zugang für Fachleute', proText: 'Reparaturbetriebe, Recycler und Behörden melden sich an, um zusätzliche Angaben zu sehen (Rollen-Vorschau in der App).', version: 'Version', updated: 'Stand', operator: 'Verantwortlich', hosted: 'bereitgestellt über Code Gaia',
    facts: [['Material','100 % Baumwolle (Bio)'],['CO2e je Stück','4,1 kg'],['Pflege','30 °C Feinwäsche'],['Hergestellt von','Muster Textil GmbH']],
    secs: [
      ['Material und Herkunft', [['Faserzusammensetzung','100 % Baumwolle (Bio)'],['Herkunftsland der Faser','Keine Angabe'],['Recyclinganteil','0 %']]],
      ['Stoffe', [['Besorgniserregende Stoffe (SVHC)','Keine über 0,1 %']]],
      ['Umwelt', [['Product Carbon Footprint','4,1 kg CO2e je Stück (ISO 14067)']]],
      ['Pflege und Nutzung', [['Pflegehinweise','30 °C Feinwäsche, nicht trocknergeeignet']]],
      ['Hersteller', [['Wirtschaftsakteur','Muster Textil GmbH'],['Produktkennung (UPI)','https://id.muster-textil.example/01/04012345000017/10/L2026-114']]]
    ],
    docs: ['Pflegeanleitung (PDF)','Konformitätsinformationen (PDF)'] },
  en: { passLabel: 'Digital Product Passport', name: 'Basic T-shirt organic cotton', sub: 'Item TS-1042 · Batch L2026-114', downloads: 'Documents', pro: 'Access for professionals', proText: 'Repairers, recyclers and authorities sign in to see additional information (role preview in the app).', version: 'Version', updated: 'Updated', operator: 'Responsible', hosted: 'provided via Code Gaia',
    facts: [['Material','100 % cotton (organic)'],['CO2e per item','4.1 kg'],['Care','30 °C delicate wash'],['Made by','Muster Textil GmbH']],
    secs: [
      ['Material and origin', [['Fibre composition','100 % cotton (organic)'],['Country of fibre origin','Not provided'],['Recycled content','0 %']]],
      ['Substances', [['Substances of very high concern (SVHC)','None above 0.1 %']]],
      ['Environment', [['Product carbon footprint','4.1 kg CO2e per item (ISO 14067)']]],
      ['Care and use', [['Care instructions','30 °C delicate wash, do not tumble dry']]],
      ['Manufacturer', [['Economic operator','Muster Textil GmbH'],['Product identifier (UPI)','https://id.muster-textil.example/01/04012345000017/10/L2026-114']]]
    ],
    docs: ['Care guide (PDF)','Compliance information (PDF)'] }
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: 'de', open: { 0: true }, login: false };
  }
  renderVals() {
    var self = this, s = this.state, t = TXT[s.lang];
    return {
      t: t,
      langs: ['de','en'].map(function (l) {
        var on = s.lang === l;
        return { label: l.toUpperCase(), go: function () { self.setState({ lang: l }); }, bg: on ? '#1459C7' : '#ffffff', fg: on ? '#ffffff' : '#3F3F46' };
      }),
      facts: t.facts.map(function (f) { return { label: f[0], value: f[1] }; }),
      sections: t.secs.map(function (sec, i) {
        var open = !!s.open[i];
        return { title: sec[0], open: open, sign: open ? '−' : '+',
          rows: sec[1].map(function (r) { return { label: r[0], value: r[1] }; }),
          toggle: function () { var n = Object.assign({}, s.open); n[i] = !n[i]; self.setState({ open: n }); } };
      }),
      docs: t.docs,
      showLogin: s.login,
      toggleLogin: function () { self.setState({ login: !s.login }); }
    };
  }
}
</script>
</body>
</html>
